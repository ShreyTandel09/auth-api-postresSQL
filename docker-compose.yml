services:
  postgres:
    container_name: auth_app
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_DB=${DB_DATABASE:-auth_app}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: auth_api
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET:-ITS_A_SECRET_KEY}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-ITS_A_REFRESH_SECRET_KEY}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-1h}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password} 
      - DB_DATABASE=${DB_DATABASE:-auth_app}
    ports:
      - "${API_PORT:-8005}:8005"
    depends_on:
      - postgres

volumes:
  postgres_data:
